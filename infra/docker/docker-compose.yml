# =============================================================================
# CoESCD Unified Digital Platform — Docker Compose
# Sovereign on-premises deployment (Tajikistan Emergency Management)
#
# PROFILES
#   infra     — PostgreSQL+PostGIS, Redis, RabbitMQ, MinIO       (always included)
#   app       — Backend API, WebSocket Gateway, Map Client, Nginx, ClamAV
#   obs       — Prometheus, Grafana, Loki, Alloy, Jaeger, exporters
#   media     — Mediasoup SFU, Coturn TURN/STUN
#   search    — OpenSearch, OpenSearch Dashboards
#   analytics — TimescaleDB time-series store
#   gis       — Martin vector tile server, GeoServer raster server
#   pipelines — Airflow scheduler + webserver + metadata DB
#   ml        — ClickHouse columnar store, MLflow tracking server + model registry
#
# USAGE
#   Start everything:
#     docker compose --profile app --profile obs --profile gis up -d
#
#   Infra only (dev):
#     docker compose up -d
#
#   Stop everything:
#     docker compose --profile app --profile obs --profile gis down
#
# REQUIREMENTS
#   Copy ../../.env.example to ../../.env and fill in all secrets before running.
#
# IMAGE VERSION NOTES (updated 2026-04-11)
#   • Promtail replaced by Grafana Alloy v1.6.1 (Promtail EOL 2026-03-02)
#   • Jaeger upgraded to v2.17.0 (v1 reached EOL 2025-12-31); badger storage removed
#   • MinIO Docker Hub archived Feb 2026 — verify tag at https://github.com/minio/minio/releases
#   • Airflow stays on 2.10.x — v3.x introduces breaking DAG API changes
#   • OpenSearch stays on 2.x — v3.x requires full cluster re-index
#   • MLflow stays on 2.x — v3.x has breaking experiment API changes
#   • Main PostGIS stays on PG16 — major version migration requires pg_upgrade
# =============================================================================

name: coescd

# ---------------------------------------------------------------------------
# Shared logging — all containers ship logs to Loki via json-file driver
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  coescd-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-db:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  jaeger-data:
  opensearch-data:
  martin-cache:
  timescaledb-data:
  geoserver-data:
  geoserver-rasters:
  airflow-db-data:
  airflow-logs:
  clickhouse-data:
  mlflow-db-data:

# ===========================================================================
# EXTENSION — Airflow shared config (top-level x- block, not a service)
# ===========================================================================
x-airflow-common: &airflow-common
  # Airflow 2.10.x — staying on 2.x LTS (3.x has breaking DAG API changes)
  image: apache/airflow:2.10.4
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${COESCD_AIRFLOW_DB_USER:-airflow}:${COESCD_AIRFLOW_DB_PASSWORD}@airflow-db:5432/${COESCD_AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__METRICS__STATSD_ON: "false"
    AIRFLOW_CONN_COESCD_POSTGRES: >-
      postgresql+psycopg2://${COESCD_POSTGRES_USER:-coescd}:${COESCD_POSTGRES_PASSWORD}@postgres:5432/${COESCD_POSTGRES_DB:-coescd}
    AIRFLOW_CONN_COESCD_TIMESCALE: >-
      postgresql+psycopg2://${COESCD_TIMESCALE_USER:-coescd_analytics}:${COESCD_TIMESCALE_PASSWORD}@timescaledb:5432/${COESCD_TIMESCALE_DB:-coescd_analytics}
    AIRFLOW_CONN_COESCD_BACKEND: >-
      http://:@backend:4000/api
    AIRFLOW_CONN_COESCD_CLICKHOUSE: >-
      http://${COESCD_CLICKHOUSE_USER:-coescd_ml}:${COESCD_CLICKHOUSE_PASSWORD}@clickhouse:8123/${COESCD_CLICKHOUSE_DB:-coescd_ml}
    COESCD_BACKEND_URL:  http://backend:4000
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID:   ${COESCD_MINIO_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${COESCD_MINIO_SECRET_KEY}
  volumes:
    - ../../apps/pipelines/dags:/opt/airflow/dags:ro
    - ../../apps/pipelines/plugins:/opt/airflow/plugins:ro
    - airflow-logs:/opt/airflow/logs
  networks:
    - coescd-net

# ===========================================================================
# SERVICES
# ===========================================================================
services:

  # =========================================================================
  # INFRASTRUCTURE (default profile — always starts)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.6 — spatial queries for GIS domain
  # NOTE: Staying on PG16 major version; upgrade requires pg_upgrade + PostGIS re-pack
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.6.2
    container_name: coescd-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER:     ${COESCD_POSTGRES_USER:-coescd}
      POSTGRES_PASSWORD: ${COESCD_POSTGRES_PASSWORD:?Set COESCD_POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${COESCD_POSTGRES_DB:-coescd}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COESCD_POSTGRES_USER:-coescd} -d ${COESCD_POSTGRES_DB:-coescd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
    labels:
      coescd.service: postgres
      coescd.tier: infra

  # ---------------------------------------------------------------------------
  # Redis 8 — LTS release (GA April 2025)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.0-alpine
    container_name: coescd-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
        --requirepass ${COESCD_REDIS_PASSWORD:?Set COESCD_REDIS_PASSWORD in .env}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --loglevel notice
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${COESCD_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      coescd.service: redis
      coescd.tier: infra

  # ---------------------------------------------------------------------------
  # RabbitMQ 4.0 — AMQP 0-9-1 backward compatible
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: coescd-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER:  ${COESCD_RABBITMQ_USER:-coescd}
      RABBITMQ_DEFAULT_PASS:  ${COESCD_RABBITMQ_PASSWORD:?Set COESCD_RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: coescd
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # Management UI — internal only
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      coescd.service: rabbitmq
      coescd.tier: infra

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible sovereign object storage
  # IMPORTANT: Docker Hub archived Feb 2026.
  #   Verify/update tag at: https://github.com/minio/minio/releases
  #   Alternatively: quay.io/minio/minio:<RELEASE_TAG>
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-11-07T00-35-20Z
    container_name: coescd-minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${COESCD_MINIO_ROOT_USER:-coescd_admin}
      MINIO_ROOT_PASSWORD: ${COESCD_MINIO_ROOT_PASSWORD:?Set COESCD_MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9002:9000"   # S3 API  (host 9002 → container 9000; 9000 taken by ClickHouse native)
      - "127.0.0.1:9003:9001"   # Console UI
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      coescd.service: minio
      coescd.tier: infra

  # =========================================================================
  # APPLICATION  (profile: app)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # Mailpit — local SMTP sink and inbox UI for dev / observability alerts
  # ---------------------------------------------------------------------------
  mailpit:
    profiles: [app, obs]
    image: axllent/mailpit:v1.27.4
    container_name: coescd-mailpit
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - coescd-net
    labels:
      coescd.service: mailpit
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # ClamAV — virus scanning for file uploads (referenced by Backend CLAMAV_HOST)
  # ---------------------------------------------------------------------------
  clamav:
    profiles: [app]
    image: clamav/clamav:1.4
    container_name: coescd-clamav
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Fresh virus DB updates — set CLAMAV_NO_FRESHCLAMD=true if no internet access
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310"
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s    # ClamAV loads full virus DB on startup (~2 min)
    labels:
      coescd.service: clamav
      coescd.tier: app

  # ---------------------------------------------------------------------------
  # Backend — NestJS Modular Monolith
  # ---------------------------------------------------------------------------
  backend:
    profiles: [app]
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: production
    image: coescd/backend:${APP_VERSION:-latest}
    container_name: coescd-backend
    restart: unless-stopped
    logging: *default-logging
    env_file: ../../.env
    environment:
      NODE_ENV:      production
      PORT:          4000
      HOST:          0.0.0.0
      DB_HOST:       postgres
      DB_PORT:       5432
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      RABBITMQ_URL:  amqp://${COESCD_RABBITMQ_USER:-coescd}:${COESCD_RABBITMQ_PASSWORD}@rabbitmq:5672/coescd
      MINIO_ENDPOINT: minio
      MINIO_PORT:    9000
      MINIO_USE_SSL: "false"
      OPENSEARCH_NODE: http://opensearch:9200
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      CLAMAV_CHUNK_SIZE: ${CLAMAV_CHUNK_SIZE:-65536}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@coescd.local}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_PROVIDER_TOKEN: ${SMS_PROVIDER_TOKEN:-}
      SMS_PROVIDER_AUTH_HEADER: ${SMS_PROVIDER_AUTH_HEADER:-Authorization}
      SMS_PROVIDER_TOKEN_PREFIX: ${SMS_PROVIDER_TOKEN_PREFIX:-Bearer }
      SMS_SENDER: ${SMS_SENDER:-COESCD}
      SMS_TIMEOUT_MS: ${SMS_TIMEOUT_MS:-10000}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-992}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-10000}
      TELEGRAM_DISABLE_LINK_PREVIEW: ${TELEGRAM_DISABLE_LINK_PREVIEW:-true}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:alerts@coescd.local}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_TTL_SECONDS: ${WEB_PUSH_TTL_SECONDS:-300}
      WEB_PUSH_URGENCY: ${WEB_PUSH_URGENCY:-high}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      coescd.service: backend
      coescd.tier: app

  # ---------------------------------------------------------------------------
  # WebSocket Gateway — Real-time event bus for connected clients
  # ---------------------------------------------------------------------------
  gateway:
    profiles: [app]
    build:
      context: ../../apps/gateway
      dockerfile: Dockerfile
      target: production
    image: coescd/gateway:${APP_VERSION:-latest}
    container_name: coescd-gateway
    restart: unless-stopped
    logging: *default-logging
    env_file: ../../.env
    environment:
      NODE_ENV:     production
      PORT:         4001
      BACKEND_URL:  http://backend:4000
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      RABBITMQ_URL: amqp://${COESCD_RABBITMQ_USER:-coescd}:${COESCD_RABBITMQ_PASSWORD}@rabbitmq:5672/coescd
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      coescd.service: gateway
      coescd.tier: app

  # ---------------------------------------------------------------------------
  # Nginx 1.28 — TLS termination, rate limiting, reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    profiles: [app]
    image: nginx:1.28.3-alpine
    container_name: coescd-nginx
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"   # TLS — place certs in ./nginx/certs/ and configure conf.d/
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      coescd.service: nginx
      coescd.tier: app

  # =========================================================================
  # OBSERVABILITY  (profile: obs)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # Prometheus 2.53 — metrics collection and alerting (LTS branch)
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.53.5
    container_name: coescd-prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      coescd.service: prometheus
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Alertmanager 0.29 — routes Prometheus alerts to email / on-call
  # ---------------------------------------------------------------------------
  alertmanager:
    profiles: [obs]
    image: prom/alertmanager:v0.29.0
    container_name: coescd-alertmanager
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./prometheus/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      coescd.service: alertmanager
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Grafana 13 — dashboards for metrics, logs, and traces
  # ---------------------------------------------------------------------------
  grafana:
    profiles: [obs]
    image: grafana/grafana:13.0.0
    container_name: coescd-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER:     ${COESCD_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${COESCD_GRAFANA_ADMIN_PASSWORD:?Set COESCD_GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      GF_SERVER_ROOT_URL:         http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - coescd-net
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      coescd.service: grafana
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Loki 3.7 — log aggregation
  # NOTE: Loki 3.x changes the default schema (tsdb). Review loki.yml before
  #       upgrading an existing 2.x deployment; a fresh volume is recommended.
  # ---------------------------------------------------------------------------
  loki:
    profiles: [obs]
    image: grafana/loki:3.7.0
    container_name: coescd-loki
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      coescd.service: loki
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Grafana Alloy 1.6 — ships container logs to Loki (replaces Promtail, EOL 2026-03-02)
  # Config: ./loki/alloy-config.alloy (River format — see file for details)
  # ---------------------------------------------------------------------------
  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.6.1
    container_name: coescd-alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./loki/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - coescd-net
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12345/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      coescd.service: alloy
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Jaeger 2.17 — distributed tracing (OTLP receiver)
  # NOTE: Jaeger v2 removed badger storage; uses memory for single-node.
  #       For production persistence, set SPAN_STORAGE_TYPE=opensearch and
  #       configure ES_SERVER_URLS=http://opensearch:9200 (search profile).
  # ---------------------------------------------------------------------------
  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:2.17.0
    container_name: coescd-jaeger
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPAN_STORAGE_TYPE:    memory
      MEMORY_MAX_TRACES:    "50000"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      coescd.service: jaeger
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Node Exporter 1.10 — host-level metrics for Prometheus
  # ---------------------------------------------------------------------------
  node-exporter:
    profiles: [obs]
    image: prom/node-exporter:v1.10.2
    container_name: coescd-node-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run)($$|/)
    volumes:
      - /:/host:ro
    networks:
      - coescd-net
    labels:
      coescd.service: node-exporter
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Postgres Exporter 0.18 — PostgreSQL metrics for Prometheus
  # ---------------------------------------------------------------------------
  postgres-exporter:
    profiles: [obs]
    image: prometheuscommunity/postgres-exporter:v0.18.0
    container_name: coescd-postgres-exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://${COESCD_POSTGRES_USER:-coescd}:${COESCD_POSTGRES_PASSWORD}@postgres:5432/${COESCD_POSTGRES_DB:-coescd}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coescd-net
    labels:
      coescd.service: postgres-exporter
      coescd.tier: obs

  # ---------------------------------------------------------------------------
  # Redis Exporter 1.75 — Redis metrics for Prometheus
  # ---------------------------------------------------------------------------
  redis-exporter:
    profiles: [obs]
    image: oliver006/redis_exporter:v1.75.0
    container_name: coescd-redis-exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_ADDR:     redis://redis:6379
      REDIS_PASSWORD: ${COESCD_REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - coescd-net
    labels:
      coescd.service: redis-exporter
      coescd.tier: obs

  # =========================================================================
  # MEDIA  (profile: media)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # Mediasoup SFU — WebRTC Selective Forwarding Unit for audio/video calls
  # ---------------------------------------------------------------------------
  media:
    profiles: [media]
    build:
      context: ../../apps/media
      dockerfile: Dockerfile
      target: production
    image: coescd/media:${APP_VERSION:-latest}
    container_name: coescd-media
    restart: unless-stopped
    logging: *default-logging
    env_file: ../../.env
    environment:
      NODE_ENV:                production
      PORT:                    4002
      HOST:                    0.0.0.0
      REDIS_HOST:              redis
      REDIS_PORT:              6379
      RABBITMQ_URL:            amqp://${COESCD_RABBITMQ_USER:-coescd}:${COESCD_RABBITMQ_PASSWORD}@rabbitmq:5672/coescd
      # Public IP that remote peers use to reach this host (set to your server IP)
      MEDIASOUP_ANNOUNCED_IP:  ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_WORKERS:       ${MEDIASOUP_WORKERS:-2}
      RTC_MIN_PORT:            10000
      RTC_MAX_PORT:            10100
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:4002:4002"         # HTTP API + WebSocket signaling
      - "10000-10100:10000-10100/udp"  # RTP/RTCP media
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      coescd.service: media
      coescd.tier: media

  # ---------------------------------------------------------------------------
  # Coturn 4.9 — STUN/TURN server for WebRTC NAT traversal
  # ---------------------------------------------------------------------------
  coturn:
    profiles: [media]
    image: coturn/coturn:4.9.0-alpine
    container_name: coescd-coturn
    restart: unless-stopped
    logging: *default-logging
    network_mode: host     # TURN requires host networking for correct NAT behaviour
    command: >
      -n
      --log-file=stdout
      --external-ip=$${TURN_EXTERNAL_IP:-127.0.0.1}
      --listening-port=3478
      --tls-listening-port=5349
      --fingerprint
      --lt-cred-mech
      --realm=${COESCD_TURN_REALM:-coescd.local}
      --user=${COESCD_TURN_USER:-coescd}:${COESCD_TURN_PASSWORD:?Set COESCD_TURN_PASSWORD in .env}
      --min-port=49152
      --max-port=65535
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
    labels:
      coescd.service: coturn
      coescd.tier: media

  # =========================================================================
  # SEARCH  (profile: search)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # OpenSearch 2.19 — full-text search and analytics engine
  # NOTE: Staying on 2.x; OpenSearch 3.x requires full cluster re-indexing
  # ---------------------------------------------------------------------------
  opensearch:
    profiles: [search]
    image: opensearchproject/opensearch:2.19.2
    container_name: coescd-opensearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      cluster.name: coescd-search
      node.name: opensearch-node1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"     # TLS handled by Nginx in production
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"   # REST API
      - "127.0.0.1:9600:9600"   # Performance analyzer
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      coescd.service: opensearch
      coescd.tier: search

  # ---------------------------------------------------------------------------
  # OpenSearch Dashboards 2.19 — visualization for OpenSearch
  # ---------------------------------------------------------------------------
  opensearch-dashboards:
    profiles: [search]
    image: opensearchproject/opensearch-dashboards:2.19.2
    container_name: coescd-opensearch-dashboards
    restart: unless-stopped
    logging: *default-logging
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - coescd-net
    labels:
      coescd.service: opensearch-dashboards
      coescd.tier: search

  # =========================================================================
  # ANALYTICS  (profile: analytics)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # TimescaleDB 2.26 — time-series analytical store for emergency analytics
  # Pinned to 2.26.0-pg16; do NOT use latest-pg16 (risks silent PG major upgrade)
  # ---------------------------------------------------------------------------
  timescaledb:
    profiles: [analytics]
    image: timescale/timescaledb:2.26.0-pg16
    container_name: coescd-timescaledb
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER:     ${COESCD_TIMESCALE_USER:-coescd_analytics}
      POSTGRES_PASSWORD: ${COESCD_TIMESCALE_PASSWORD:?Set COESCD_TIMESCALE_PASSWORD in .env}
      POSTGRES_DB:       ${COESCD_TIMESCALE_DB:-coescd_analytics}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # separate port from main postgres
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COESCD_TIMESCALE_USER:-coescd_analytics} -d ${COESCD_TIMESCALE_DB:-coescd_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c maintenance_work_mem=128MB
        -c work_mem=32MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c log_min_duration_statement=2000
    labels:
      coescd.service: timescaledb
      coescd.tier: analytics

  # =========================================================================
  # MAP CLIENT  (profile: app)
  # React + MapLibre GL JS GIS operational map — served as static build
  # =========================================================================
  map-client:
    profiles: [app]
    build:
      context: ../../apps/map-client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api
        VITE_TILE_URL: /tiles
        VITE_WS_URL: /ws
    image: coescd/map-client:${APP_VERSION:-latest}
    container_name: coescd-map-client
    restart: unless-stopped
    logging: *default-logging
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      coescd.service: map-client
      coescd.tier: app

  # =========================================================================
  # GIS  (profile: gis)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # GeoServer 2.28 — OGC-compliant raster tile serving (WMS/WMTS)
  # Handles DEM hillshading, satellite imagery, and complex raster products.
  # ---------------------------------------------------------------------------
  geoserver:
    profiles: [gis]
    image: kartoza/geoserver:2.28.2
    container_name: coescd-geoserver
    restart: unless-stopped
    logging: *default-logging
    environment:
      GEOSERVER_ADMIN_USER:     ${COESCD_GEOSERVER_ADMIN_USER:-geoserver_admin}
      GEOSERVER_ADMIN_PASSWORD: ${COESCD_GEOSERVER_ADMIN_PASSWORD:?Set COESCD_GEOSERVER_ADMIN_PASSWORD in .env}
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${COESCD_POSTGRES_DB:-coescd}
      POSTGRES_USER:     ${COESCD_POSTGRES_USER:-coescd}
      POSTGRES_PASS:     ${COESCD_POSTGRES_PASSWORD}
      INITIAL_MEMORY:    512m
      MAXIMUM_MEMORY:    1536m
      GEOSERVER_CSRF_DISABLED: "true"
      GEOWEBCACHE_CACHE_DIR: /opt/geoserver/data_dir/gwc
      GDAL_DATA: /usr/share/gdal
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
      - geoserver-rasters:/opt/geoserver/rasters
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/geoserver/web/ | grep -q GeoServer || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s    # GeoServer starts slowly
    labels:
      coescd.service: geoserver
      coescd.tier: gis

  # ---------------------------------------------------------------------------
  # Martin 1.3 — Rust-based vector tile server (MVT from PostGIS)
  # NOTE: v1.x may have config flag changes from 0.x — verify CLI flags if updating
  # ---------------------------------------------------------------------------
  martin:
    profiles: [gis]
    image: ghcr.io/maplibre/martin:v1.3.1
    container_name: coescd-martin
    restart: unless-stopped
    logging: *default-logging
    command: >
      --listen-addresses 0.0.0.0:3002
      --default-srid 4326
      postgres://${COESCD_POSTGRES_USER:-coescd}:${COESCD_POSTGRES_PASSWORD}@postgres:5432/${COESCD_POSTGRES_DB:-coescd}
    environment:
      RUST_LOG: info
    volumes:
      - martin-cache:/tmp/martin-cache
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      coescd.service: martin
      coescd.tier: gis

  # =========================================================================
  # PIPELINES  (profile: pipelines)
  # Apache Airflow 2.10 — spatial data ingestion and ETL pipeline orchestration
  # LocalExecutor: no Celery required at current scale
  # =========================================================================

  # ---------------------------------------------------------------------------
  # Airflow metadata database — isolated from main Postgres (PG17)
  # ---------------------------------------------------------------------------
  airflow-db:
    profiles: [pipelines]
    image: postgres:17-alpine
    container_name: coescd-airflow-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER:     ${COESCD_AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${COESCD_AIRFLOW_DB_PASSWORD:?Set COESCD_AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB:       ${COESCD_AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COESCD_AIRFLOW_DB_USER:-airflow} -d ${COESCD_AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      coescd.service: airflow-db
      coescd.tier: pipelines

  # ---------------------------------------------------------------------------
  # Airflow init — DB migrate + create admin user (runs once then exits)
  # ---------------------------------------------------------------------------
  airflow-init:
    profiles: [pipelines]
    <<: *airflow-common
    container_name: coescd-airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${COESCD_AIRFLOW_ADMIN_USER:-airflow_admin} \
          --password ${COESCD_AIRFLOW_ADMIN_PASSWORD:?Set COESCD_AIRFLOW_ADMIN_PASSWORD in .env} \
          --firstname CoESCD \
          --lastname Admin \
          --role Admin \
          --email ${COESCD_AIRFLOW_ADMIN_EMAIL:-admin@coescd.local} || true
    depends_on:
      airflow-db:
        condition: service_healthy
    labels:
      coescd.service: airflow-init
      coescd.tier: pipelines

  # ---------------------------------------------------------------------------
  # Airflow Webserver — pipeline management UI on port 8088
  # ---------------------------------------------------------------------------
  airflow-webserver:
    profiles: [pipelines]
    <<: *airflow-common
    container_name: coescd-airflow-webserver
    restart: unless-stopped
    logging: *default-logging
    command: webserver
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      coescd.service: airflow-webserver
      coescd.tier: pipelines

  # ---------------------------------------------------------------------------
  # Airflow Scheduler — triggers DAG runs per schedule
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    profiles: [pipelines]
    <<: *airflow-common
    container_name: coescd-airflow-scheduler
    restart: unless-stopped
    logging: *default-logging
    command: scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      coescd.service: airflow-scheduler
      coescd.tier: pipelines

  # =========================================================================
  # ML  (profile: ml)
  # =========================================================================

  # ---------------------------------------------------------------------------
  # ClickHouse 25.4 — columnar OLAP store for large-scale feature/prediction data
  # ---------------------------------------------------------------------------
  clickhouse:
    profiles: [ml]
    image: clickhouse/clickhouse-server:25.4-alpine
    container_name: coescd-clickhouse
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB:       ${COESCD_CLICKHOUSE_DB:-coescd_ml}
      CLICKHOUSE_USER:     ${COESCD_CLICKHOUSE_USER:-coescd_ml}
      CLICKHOUSE_PASSWORD: ${COESCD_CLICKHOUSE_PASSWORD:?Set COESCD_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface
      - "127.0.0.1:9000:9000"   # Native protocol
    networks:
      - coescd-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      coescd.service: clickhouse
      coescd.tier: ml

  # ---------------------------------------------------------------------------
  # MLflow metadata DB — Postgres 17 for experiment/run/model registry metadata
  # ---------------------------------------------------------------------------
  mlflow-db:
    profiles: [ml]
    image: postgres:17-alpine
    container_name: coescd-mlflow-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER:     ${COESCD_MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${COESCD_MLFLOW_DB_PASSWORD:?Set COESCD_MLFLOW_DB_PASSWORD in .env}
      POSTGRES_DB:       ${COESCD_MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    networks:
      - coescd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COESCD_MLFLOW_DB_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      coescd.service: mlflow-db
      coescd.tier: ml

  # ---------------------------------------------------------------------------
  # MLflow 2.19 — experiment tracking + model registry
  # Artifacts stored in MinIO (s3-compatible), metadata in mlflow-db (Postgres)
  # NOTE: Staying on 2.x — MLflow 3.x has breaking changes to the experiment API
  # ---------------------------------------------------------------------------
  mlflow:
    profiles: [ml]
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: coescd-mlflow
    restart: unless-stopped
    logging: *default-logging
    environment:
      MLFLOW_TRACKING_URI:    postgresql+psycopg2://${COESCD_MLFLOW_DB_USER:-mlflow}:${COESCD_MLFLOW_DB_PASSWORD}@mlflow-db:5432/${COESCD_MLFLOW_DB_NAME:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID:      ${COESCD_MINIO_ACCESS_KEY:?Set COESCD_MINIO_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY:  ${COESCD_MINIO_SECRET_KEY:?Set COESCD_MINIO_SECRET_KEY in .env}
      MLFLOW_ARTIFACT_ROOT:   s3://coescd-mlflow/artifacts
      GUNICORN_CMD_ARGS:      "--workers=2 --timeout=120"
    command: >
      mlflow server
        --backend-store-uri postgresql+psycopg2://${COESCD_MLFLOW_DB_USER:-mlflow}:${COESCD_MLFLOW_DB_PASSWORD}@mlflow-db:5432/${COESCD_MLFLOW_DB_NAME:-mlflow}
        --artifacts-destination s3://coescd-mlflow/artifacts
        --host 0.0.0.0
        --port 5000
        --serve-artifacts
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - coescd-net
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      coescd.service: mlflow
      coescd.tier: ml
