server {
    listen 80;
    server_name coescd.internal localhost;

    client_max_body_size 100M;

    set $backend_upstream    http://backend:4000;
    set $gateway_upstream    http://gateway:4001;
    set $map_client_upstream http://map-client:3003;
    set $martin_upstream     http://martin:3002;
    set $geoserver_upstream  http://geoserver:8080;

    location = / {
        return 302 /map/;
    }

    # REST API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
    }

    # Auth endpoints — stricter rate limiting
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket Gateway
    location /ws/ {
        proxy_pass         $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Martin vector tile server — MVT tiles for GIS layers
    location /tiles/ {
        rewrite            ^/tiles/?(.*)$ /$1 break;
        proxy_pass         $martin_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache tiles at the Nginx layer (TTL varies by layer — see architecture doc §5.2)
        proxy_cache        tiles;
        proxy_cache_key    "$uri$is_args$args";
        proxy_cache_valid  200 5m;   # Default: 5-minute TTL (incident layer cadence)
        add_header         X-Cache-Status $upstream_cache_status;
    }

    # GeoServer — WMS/WMTS raster tile endpoints
    # Path: /geoserver/ → http://geoserver:8080/geoserver/
    # Cache raster tiles aggressively (DEM hillshading changes rarely)
    location ~ ^/geoserver/web {
        deny all;
    }

    location /geoserver/ {
        proxy_pass         $geoserver_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # GIS Map Client — React SPA
    location = /map {
        return 301 /map/;
    }

    location = /map/index.html {
        rewrite            ^/map/index.html$ /index.html break;
        proxy_pass         $map_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header         Cache-Control "no-cache";
    }

    location /map/ {
        rewrite            ^/map/?(.*)$ /$1 break;
        proxy_pass         $map_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
