server {
    listen 443 ssl;
    server_name coescd.internal;

    ssl_certificate     /etc/nginx/certs/coescd.crt;
    ssl_certificate_key /etc/nginx/certs/coescd.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    # REST API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
    }

    # Auth endpoints — stricter rate limiting
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket Gateway
    location /ws/ {
        proxy_pass         http://gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Martin vector tile server — MVT tiles for GIS layers
    location /tiles/ {
        proxy_pass         http://martin:3002/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache tiles at the Nginx layer (TTL varies by layer — see architecture doc §5.2)
        proxy_cache_path   /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m
                           inactive=1h max_size=500m;
        proxy_cache        tiles;
        proxy_cache_key    "$uri$is_args$args";
        proxy_cache_valid  200 5m;   # Default: 5-minute TTL (incident layer cadence)
        add_header         X-Cache-Status $upstream_cache_status;
    }

    # GeoServer — WMS/WMTS raster tile endpoints
    # Path: /geoserver/ → http://geoserver:8080/geoserver/
    # Cache raster tiles aggressively (DEM hillshading changes rarely)
    location /geoserver/ {
        proxy_pass         http://geoserver:8080/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Do not expose GeoServer admin UI through public proxy
        location ~ ^/geoserver/web {
            deny all;
        }
    }

    # GIS Map Client — React SPA
    location /map/ {
        proxy_pass         http://map-client:3003/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Never cache index.html (SPA entry point)
        location = /map/index.html {
            proxy_pass http://map-client:3003/index.html;
            add_header Cache-Control "no-cache";
        }
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name coescd.internal;
    return 301 https://$host$request_uri;
}
