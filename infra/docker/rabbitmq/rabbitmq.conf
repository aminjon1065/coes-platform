# CoESCD RabbitMQ Configuration

# Networking
listeners.tcp.default = 5672
management.tcp.port   = 15672

# Authentication
auth_backends.1 = internal

# Heartbeat
heartbeat = 60

# Message limits
max_message_size = 134217728

# Queue defaults
default_vhost        = coescd
default_queue_type   = classic

# Logging
log.console = true
log.console.level = info
