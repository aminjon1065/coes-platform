{{- if .Values.opensearch.enabled }}
# =============================================================================
# OpenSearch 2.13 — StatefulSet
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coescd.fullname" . }}-opensearch
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 4 }}
spec:
  serviceName: {{ include "coescd.fullname" . }}-opensearch
  replicas: {{ .Values.opensearch.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coescd.labels" . | nindent 8 }}
        {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 8 }}
    spec:
      {{- include "coescd.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      # Required: increase vm.max_map_count on nodes
      initContainers:
        - name: sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
      {{- include "coescd.tolerations" . | nindent 6 }}
      {{- include "coescd.nodeSelector" (dict "component" .Values.opensearch "root" .) | nindent 6 }}
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.opensearch.service.port }}
            - name: transport
              containerPort: 9300
          env:
            - name: cluster.name
              value: coescd-opensearch
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.seed_hosts
              value: {{ include "coescd.fullname" . }}-opensearch
            - name: cluster.initial_master_nodes
              {{- $replicas := int .Values.opensearch.replicas }}
              {{- $nodes := list }}
              {{- range $i := until $replicas }}
              {{- $nodes = append $nodes (printf "%s-opensearch-%d" (include "coescd.fullname" $) $i) }}
              {{- end }}
              value: {{ join "," $nodes | quote }}
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.javaOpts | quote }}
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "coescd.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ include "coescd.storageClass" . }}
        resources:
          requests:
            storage: {{ .Values.opensearch.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coescd.fullname" . }}-opensearch
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.opensearch.service.port }}
      targetPort: http
    - name: transport
      port: 9300
      targetPort: transport
  selector:
    {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 4 }}
---
# Stable client service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coescd.fullname" . }}-opensearch-client
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.opensearch.service.port }}
      targetPort: http
  selector:
    {{- include "coescd.selectorLabels" (dict "component" "opensearch" "root" .) | nindent 4 }}
{{- end }}
