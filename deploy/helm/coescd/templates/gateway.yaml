{{- if .Values.gateway.enabled }}
# =============================================================================
# Gateway — WebSocket real-time service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coescd.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "gateway" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "coescd.selectorLabels" (dict "component" "gateway" "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "coescd.labels" . | nindent 8 }}
        {{- include "coescd.selectorLabels" (dict "component" "gateway" "root" .) | nindent 8 }}
    spec:
      {{- include "coescd.imagePullSecrets" . | nindent 6 }}
      {{- include "coescd.tolerations" . | nindent 6 }}
      {{- include "coescd.nodeSelector" (dict "component" .Values.gateway "root" .) | nindent 6 }}
      terminationGracePeriodSeconds: 60   # Allow WS connections to drain
      containers:
        - name: gateway
          image: {{ include "coescd.image" (dict "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.gateway.service.port | quote }}
            - name: REDIS_HOST
              value: {{ include "coescd.fullname" . }}-redis.{{ .Values.global.namespace }}.svc.cluster.local
            - name: REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@{{ include "coescd.fullname" . }}-rabbitmq-client.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.rabbitmq.service.amqpPort }}/{{ .Values.rabbitmq.credentials.vhost }}
          {{- if .Values.gateway.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.gateway.existingSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.gateway.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.gateway.readinessProbe | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coescd.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "gateway" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: {{ .Values.gateway.service.port }}
      targetPort: ws
  selector:
    {{- include "coescd.selectorLabels" (dict "component" "gateway" "root" .) | nindent 4 }}
---
{{- if .Values.gateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "coescd.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "coescd.fullname" . }}-gateway
  minReplicas: {{ .Values.gateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.gateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
