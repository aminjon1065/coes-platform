{{- if .Values.postgres.enabled }}
# =============================================================================
# PostgreSQL 16 + PostGIS 3.4 — StatefulSet
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coescd.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
spec:
  serviceName: {{ include "coescd.fullname" . }}-postgres
  replicas: {{ .Values.postgres.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "coescd.selectorLabels" (dict "component" "postgres" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coescd.labels" . | nindent 8 }}
        {{- include "coescd.selectorLabels" (dict "component" "postgres" "root" .) | nindent 8 }}
    spec:
      {{- include "coescd.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      {{- include "coescd.tolerations" . | nindent 6 }}
      {{- include "coescd.nodeSelector" (dict "component" .Values.postgres "root" .) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.credentials.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.credentials.database | quote }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.postgres.credentials.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentials.existingSecret }}
                  key: postgres-password
              {{- else }}
              value: {{ .Values.postgres.credentials.password | quote }}
              {{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_MAX_CONNECTIONS
              value: {{ .Values.postgres.config.maxConnections | quote }}
            - name: POSTGRES_SHARED_BUFFERS
              value: {{ .Values.postgres.config.sharedBuffers | quote }}
          args:
            - "-c"
            - "max_connections={{ .Values.postgres.config.maxConnections }}"
            - "-c"
            - "shared_buffers={{ .Values.postgres.config.sharedBuffers }}"
            - "-c"
            - "effective_cache_size={{ .Values.postgres.config.effectiveCacheSize }}"
            - "-c"
            - "maintenance_work_mem={{ .Values.postgres.config.maintenanceWorkMem }}"
            - "-c"
            - "wal_buffers={{ .Values.postgres.config.walBuffers }}"
            - "-c"
            - "log_min_duration_statement={{ .Values.postgres.config.logMinDurationStatement }}"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "archive_mode=off"
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: wal
              mountPath: /var/lib/postgresql/wal
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.credentials.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.credentials.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "coescd.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ include "coescd.storageClass" . }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
    - metadata:
        name: wal
        labels:
          {{- include "coescd.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ include "coescd.storageClass" . }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.walSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coescd.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None   # Headless for StatefulSet DNS
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
  selector:
    {{- include "coescd.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
{{- end }}
