{{- if .Values.backend.enabled }}
# =============================================================================
# Backend — NestJS Modular Monolith (Deployment + HPA + ConfigMap)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coescd.fullname" . }}-backend-env
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | quote }}
  PORT: {{ .Values.backend.env.PORT | quote }}
  HOST: {{ .Values.backend.env.HOST | quote }}
  THROTTLE_TTL: {{ .Values.backend.env.THROTTLE_TTL | quote }}
  THROTTLE_LIMIT: {{ .Values.backend.env.THROTTLE_LIMIT | quote }}
  # Service discovery — internal cluster DNS
  DB_HOST: {{ include "coescd.fullname" . }}-postgres.{{ .Values.global.namespace }}.svc.cluster.local
  DB_PORT: {{ .Values.postgres.service.port | quote }}
  DB_NAME: {{ .Values.postgres.credentials.database | quote }}
  DB_USER: {{ .Values.postgres.credentials.user | quote }}
  REDIS_HOST: {{ include "coescd.fullname" . }}-redis.{{ .Values.global.namespace }}.svc.cluster.local
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  RABBITMQ_HOST: {{ include "coescd.fullname" . }}-rabbitmq-client.{{ .Values.global.namespace }}.svc.cluster.local
  RABBITMQ_PORT: {{ .Values.rabbitmq.service.amqpPort | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.credentials.vhost | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.credentials.user | quote }}
  MINIO_ENDPOINT: {{ include "coescd.fullname" . }}-minio-api.{{ .Values.global.namespace }}.svc.cluster.local
  MINIO_PORT: {{ .Values.minio.service.apiPort | quote }}
  MINIO_USE_SSL: "false"
  CLAMAV_ENABLED: {{ .Values.backend.env.CLAMAV_ENABLED | quote }}
  CLAMAV_HOST: {{ .Values.backend.env.CLAMAV_HOST | quote }}
  CLAMAV_PORT: {{ .Values.backend.env.CLAMAV_PORT | quote }}
  CLAMAV_TIMEOUT_MS: {{ .Values.backend.env.CLAMAV_TIMEOUT_MS | quote }}
  CLAMAV_CHUNK_SIZE: {{ .Values.backend.env.CLAMAV_CHUNK_SIZE | quote }}
  SMTP_ENABLED: {{ .Values.backend.env.SMTP_ENABLED | quote }}
  SMTP_HOST: {{ .Values.backend.env.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.backend.env.SMTP_PORT | quote }}
  SMTP_SECURE: {{ .Values.backend.env.SMTP_SECURE | quote }}
  SMTP_FROM: {{ .Values.backend.env.SMTP_FROM | quote }}
  SMTP_REPLY_TO: {{ .Values.backend.env.SMTP_REPLY_TO | quote }}
  SMTP_TIMEOUT_MS: {{ .Values.backend.env.SMTP_TIMEOUT_MS | quote }}
  SMTP_REQUIRE_TLS: {{ .Values.backend.env.SMTP_REQUIRE_TLS | quote }}
  SMTP_IGNORE_TLS: {{ .Values.backend.env.SMTP_IGNORE_TLS | quote }}
  SMS_ENABLED: {{ .Values.backend.env.SMS_ENABLED | quote }}
  SMS_PROVIDER_URL: {{ .Values.backend.env.SMS_PROVIDER_URL | quote }}
  SMS_PROVIDER_AUTH_HEADER: {{ .Values.backend.env.SMS_PROVIDER_AUTH_HEADER | quote }}
  SMS_PROVIDER_TOKEN_PREFIX: {{ .Values.backend.env.SMS_PROVIDER_TOKEN_PREFIX | quote }}
  SMS_SENDER: {{ .Values.backend.env.SMS_SENDER | quote }}
  SMS_TIMEOUT_MS: {{ .Values.backend.env.SMS_TIMEOUT_MS | quote }}
  SMS_DEFAULT_COUNTRY_CODE: {{ .Values.backend.env.SMS_DEFAULT_COUNTRY_CODE | quote }}
  TELEGRAM_ENABLED: {{ .Values.backend.env.TELEGRAM_ENABLED | quote }}
  TELEGRAM_API_BASE_URL: {{ .Values.backend.env.TELEGRAM_API_BASE_URL | quote }}
  TELEGRAM_TIMEOUT_MS: {{ .Values.backend.env.TELEGRAM_TIMEOUT_MS | quote }}
  TELEGRAM_DISABLE_LINK_PREVIEW: {{ .Values.backend.env.TELEGRAM_DISABLE_LINK_PREVIEW | quote }}
  WEB_PUSH_ENABLED: {{ .Values.backend.env.WEB_PUSH_ENABLED | quote }}
  WEB_PUSH_SUBJECT: {{ .Values.backend.env.WEB_PUSH_SUBJECT | quote }}
  WEB_PUSH_VAPID_PUBLIC_KEY: {{ .Values.backend.env.WEB_PUSH_VAPID_PUBLIC_KEY | quote }}
  WEB_PUSH_TTL_SECONDS: {{ .Values.backend.env.WEB_PUSH_TTL_SECONDS | quote }}
  WEB_PUSH_URGENCY: {{ .Values.backend.env.WEB_PUSH_URGENCY | quote }}
  OPENSEARCH_HOST: {{ include "coescd.fullname" . }}-opensearch-client.{{ .Values.global.namespace }}.svc.cluster.local
  OPENSEARCH_PORT: {{ .Values.opensearch.service.port | quote }}
  TIMESCALEDB_HOST: {{ include "coescd.fullname" . }}-timescaledb.{{ .Values.global.namespace }}.svc.cluster.local
  TIMESCALEDB_PORT: {{ .Values.timescaledb.service.port | quote }}
  TIMESCALEDB_NAME: {{ .Values.timescaledb.credentials.database | quote }}
  TIMESCALEDB_USER: {{ .Values.timescaledb.credentials.user | quote }}
  MARTIN_URL: http://{{ include "coescd.fullname" . }}-martin.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.martin.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coescd.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "backend" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "coescd.selectorLabels" (dict "component" "backend" "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "coescd.labels" . | nindent 8 }}
        {{- include "coescd.selectorLabels" (dict "component" "backend" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend.yaml") . | sha256sum }}
    spec:
      {{- include "coescd.imagePullSecrets" . | nindent 6 }}
      {{- include "coescd.tolerations" . | nindent 6 }}
      {{- include "coescd.nodeSelector" (dict "component" .Values.backend "root" .) | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: {{ include "coescd.image" (dict "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "coescd.fullname" . }}-backend-env
          {{- if .Values.backend.existingSecret }}
          envFrom:
            - configMapRef:
                name: {{ include "coescd.fullname" . }}-backend-env
            - secretRef:
                name: {{ .Values.backend.existingSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coescd.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
    {{- include "coescd.selectorLabels" (dict "component" "backend" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    {{- include "coescd.selectorLabels" (dict "component" "backend" "root" .) | nindent 4 }}
---
{{- if .Values.backend.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "coescd.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "coescd.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "coescd.fullname" . }}-backend
  minReplicas: {{ .Values.backend.hpa.minReplicas }}
  maxReplicas: {{ .Values.backend.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.targetMemoryUtilizationPercentage }}
{{- end }}
{{- end }}
