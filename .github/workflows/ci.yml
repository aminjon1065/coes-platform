name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: registry.coescd.gov.tj
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + unit tests
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — Test
    runs-on: self-hosted   # On-prem runner (air-gapped environment)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @coescd/backend

      - name: Type-check
        run: npm run build -w @coescd/backend

      - name: Unit tests
        run: npm run test -w @coescd/backend -- --coverage --ci --forceExit
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage/

  # ---------------------------------------------------------------------------
  # Baseline smoke flows: representative cross-domain scenarios
  # ---------------------------------------------------------------------------
  smoke-flows:
    name: Smoke — Baseline Flows
    runs-on: self-hosted
    needs: [backend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run smoke baseline
        run: npm run smoke:baseline
        env:
          NODE_ENV: test

  # ---------------------------------------------------------------------------
  # Map client: lint + build
  # ---------------------------------------------------------------------------
  map-client-build:
    name: Map Client — Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @coescd/map-client

      - name: Build
        run: npm run build -w @coescd/map-client
        env:
          VITE_API_URL: /api
          VITE_WS_URL: /ws
          VITE_TILES_URL: /tiles

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-client-dist
          path: apps/map-client/dist/

  # ---------------------------------------------------------------------------
  # Helm chart: lint + template validation
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm — Lint & Template
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helm lint (dev values)
        run: |
          helm lint deploy/helm/coescd \
            --values deploy/helm/coescd/values.yaml

      - name: Helm lint (production values)
        run: |
          helm lint deploy/helm/coescd \
            --values deploy/helm/coescd/values.yaml \
            --values deploy/helm/coescd/values.production.yaml

      - name: Helm template (dry-run render)
        run: |
          helm template coescd deploy/helm/coescd \
            --values deploy/helm/coescd/values.yaml \
            --values deploy/helm/coescd/values.production.yaml \
            --debug > /tmp/rendered-manifests.yaml
          echo "Rendered $(grep '^---$' /tmp/rendered-manifests.yaml | wc -l) resource blocks."

      - name: Validate manifests with kubeval (if available)
        run: |
          if command -v kubeval &> /dev/null; then
            kubeval /tmp/rendered-manifests.yaml --ignore-missing-schemas
          else
            echo "kubeval not installed — skipping schema validation."
          fi

  # ---------------------------------------------------------------------------
  # Build and push Docker images
  # ---------------------------------------------------------------------------
  build-images:
    name: Docker — Build & Push
    runs-on: self-hosted
    needs: [backend-test, smoke-flows, map-client-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    strategy:
      matrix:
        service:
          - name: backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
            image: coescd/backend
          - name: gateway
            context: apps/gateway
            dockerfile: apps/gateway/Dockerfile
            image: coescd/gateway
          - name: media
            context: apps/media
            dockerfile: apps/media/Dockerfile
            image: coescd/media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "extra_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "extra_tag=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service.image }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.service.image }}:${{ steps.tag.outputs.extra_tag }}
          build-args: |
            BUILD_VERSION=${{ steps.tag.outputs.tag }}
            BUILD_COMMIT=${{ github.sha }}

      - name: Output image digest
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ matrix.service.image }}:${{ steps.tag.outputs.tag }}"
